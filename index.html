<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Jumper - Epic Galaxy Adventure</title>
    
    <!-- Website & PWA App Ke Liye Zaroori Meta Tags -->
    <meta name="description" content="An epic 2D space adventure game built with Kaboom.js">
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-logo-box {
            width: 135px;
            height: 135px;
            background: 
                radial-gradient(circle at 30% 30%, rgba(100, 40, 160, 0.6) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 150, 200, 0.5) 0%, transparent 50%),
                radial-gradient(circle at center, #090d1f 0%, #010409 100%);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 255, 200, 0.7);
            border: 2px solid #00ffcc;
            margin-bottom: 20px;
            font-size: 92px;
            position: relative;
            overflow: hidden;
        }

        #splash-logo-box::before {
            content: "✨ ⭐ 🌟 💫 ✨ ⭐️";
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: 10px;
            letter-spacing: 12px;
            line-height: 25px;
            padding: 10px;
            opacity: 0.7;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        #splash-logo-box span {
            position: relative;
            z-index: 2;
        }

        #splash-screen h2 {
            color: #00ffcc;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            font-size: 26px;
        }

        #splash-screen p {
            color: #8892b0;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div id="splash-logo-box"><span>🛸</span></div>
        <h2>Space Jumper</h2>
        <p>Loading Galaxy...</p>
    </div>

<!-- Kaboom.js Library CDN -->
<script src="https://unpkg.com/kaboom@3000/dist/kaboom.js"></script>

<script>
// PWA Service Worker Registration
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW registration failed", err));
    });
}

setTimeout(() => {
    const splash = document.getElementById("splash-screen");
    if (splash) {
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
        }, 500);
    }
}, 3000);

kaboom({
    background: [5, 10, 25],
    width: 640,
    height: 480,
    letterbox: true,
});

const characters = [
    { name: "Space Ship", color: rgb(150, 100, 255), type: "spaceship", symbol: "🛸" },
    { name: "Laser Fighter", color: rgb(0, 255, 150), type: "fighter", symbol: "🚀" },
    { name: "Sting Bee", color: rgb(255, 220, 50), type: "bee", symbol: "🐝" },
    { name: "Blue Ball", color: rgb(100, 220, 255), type: "blueball", symbol: "🔵" },
    { name: "Red Ball", color: rgb(255, 80, 80), type: "redball", symbol: "🔴" },
    { name: "Sun Ball", color: rgb(255, 200, 0), type: "sun", symbol: "☀️" },
    { name: "Planet Orb", color: rgb(50, 150, 255), type: "planet", symbol: "🪐" },
    { name: "Normal Rock", color: rgb(140, 130, 120), type: "rock", symbol: "🪨" },
    { name: "Golden Eagle", color: rgb(255, 215, 0), type: "eagle", symbol: "🦅" },
    { name: "Flying Bird", color: rgb(100, 240, 150), type: "bird", symbol: "🕊️" },
    { name: "Magic Crystal", color: rgb(200, 100, 255), type: "crystal", symbol: "💎" },
    { name: "Star Ball", color: rgb(255, 255, 255), type: "star", symbol: "⭐" }
];

let currentLevelNum = parseInt(localStorage.getItem("space_escape_level")) || 1;
let maxUnlockedLevel = parseInt(localStorage.getItem("space_escape_max")) || 1;
let selectedCharacterIndex = parseInt(localStorage.getItem("space_escape_char")) ?? 0;
if (isNaN(selectedCharacterIndex) || selectedCharacterIndex < 0 || selectedCharacterIndex >= characters.length) {
    selectedCharacterIndex = 0;
}

let lossCounter = parseInt(localStorage.getItem("space_escape_losses")) || 0;
let consecutiveLosses = parseInt(localStorage.getItem("space_escape_consecutive")) || 0;
let adThreshold = parseInt(localStorage.getItem("space_escape_threshold")) || 2;

function saveProgress() {
    localStorage.setItem("space_escape_level", currentLevelNum);
    localStorage.setItem("space_escape_max", maxUnlockedLevel);
    localStorage.setItem("space_escape_char", selectedCharacterIndex);
    localStorage.setItem("space_escape_losses", lossCounter);
    localStorage.setItem("space_escape_consecutive", consecutiveLosses);
    localStorage.setItem("space_escape_threshold", adThreshold);
}

function drawSpaceBackground() {
    add([rect(width(), height()), color(3, 7, 18), fixed()]);
    add([circle(120), pos(150, 120), color(60, 20, 100), opacity(0.25), fixed()]);
    add([circle(160), pos(480, 320), color(20, 50, 100), opacity(0.2), fixed()]);

    for (let i = 0; i < 90; i++) {
        const starX = (i * 43) % width();
        const starY = (i * 89) % height();
        const starSize = (i % 4 === 0) ? 2 : 1;
        add([circle(starSize), pos(starX, starY), color(200, 230, 255), opacity(rand(0.4, 1.0)), fixed()]);
    }
}

// Banner Ad sirf Menus ke liye
function drawBannerAd() {
    const banner = add([
        rect(width(), 45), pos(0, height() - 45),
        color(15, 20, 30), outline(1, rgb(80, 90, 120)),
        fixed(), z(100), "bannerAd"
    ]);
    banner.add([text("📢 ADVERTISEMENT", { size: 12 }), anchor("center"), pos(width() / 2, 22), color(200, 200, 200)]);
}

const ctx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, duration, type = "sine", vol = 0.2) {
    try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) {}
}

function playCrashSound() {
    try {
        playSound(100, 0.2, "sawtooth", 0.4);
        setTimeout(() => playSound(50, 0.3, "square", 0.3), 60);
    } catch (e) {}
}

scene("loading", () => {
    drawSpaceBackground();
    const titleBoxWidth = 460;
    const titleBoxHeight = 100;
    const boxX = width() / 2 - titleBoxWidth / 2;
    const boxY = height() / 2 - 130;

    add([rect(titleBoxWidth, titleBoxHeight, { radius: 16 }), pos(boxX, boxY), color(15, 22, 45), outline(3, rgb(0, 255, 200))]);
    add([text("🚀 SPACE JUMPER 🚀", { size: 28 }), pos(width() / 2, boxY + 36), anchor("center"), color(255, 215, 0)]);
    add([text("— EPIC GALAXY ADVENTURE —", { size: 12 }), pos(width() / 2, boxY + 74), anchor("center"), color(120, 200, 255)]);
    add([text("Initializing Galaxy...", { size: 13 }), pos(width() / 2, height() - 100), anchor("center"), color(180, 200, 220)]);

    const barWidth = 360;
    const barHeight = 18;
    const barX = width() / 2 - barWidth / 2;
    const barY = height() - 75;

    add([rect(barWidth, barHeight, { radius: 9 }), pos(barX, barY), color(20, 35, 60), outline(2, rgb(100, 180, 255))]);

    let loadProgress = 0;
    const fillBar = add([rect(4, barHeight - 8, { radius: 5 }), pos(barX + 4, barY + 4), color(0, 255, 128)]);

    let splashWaitTime = 0;
    onUpdate(() => {
        splashWaitTime += dt();
        if (splashWaitTime >= 3.0) {
            loadProgress += dt() * 140;
            if (loadProgress >= barWidth - 8) {
                loadProgress = barWidth - 8;
                go("map");
            }
            fillBar.width = loadProgress;
        }
    });
});

scene("character-select", () => {
    drawSpaceBackground();
    drawBannerAd();

    const backMapBtn = add([rect(90, 30, { radius: 6 }), pos(20, 10), color(220, 100, 50), area(), fixed(), z(15)]);
    backMapBtn.add([text("<< Back", { size: 12 }), anchor("center"), pos(45, 15), color(255, 255, 255)]);
    backMapBtn.onClick(() => { saveProgress(); go("map"); });

    add([rect(width(), 50), pos(0, 0), color(15, 25, 45), fixed(), z(10)]);
    add([text("CHOOSE YOUR CHARACTER", { size: 20 }), pos(width() / 2, 25), anchor("center"), color(255, 215, 0), fixed(), z(11)]);

    const startX = 95, startY = 110, spacingX = 115, spacingY = 95;
    characters.forEach((char, index) => {
        const row = Math.floor(index / 4);
        const col = index % 4;
        const posX = startX + col * spacingX;
        const posY = startY + row * spacingY;

        const isSelected = selectedCharacterIndex === index;
        const card = add([
            rect(100, 75, { radius: 10 }), pos(posX, posY),
            color(30, 45, 75), outline(2, isSelected ? rgb(0, 255, 128) : rgb(100, 150, 200)),
            area(), "charcard", { charIndex: index }
        ]);

        const sym = card.add([text(char.symbol, { size: 28 }), anchor("center"), pos(50, 30)]);
        if (["bee", "bird", "eagle"].includes(char.type)) sym.scale = vec2(-1, 1);
        card.add([text(char.name, { size: 9 }), anchor("center"), pos(50, 62), color(255, 255, 255)]);
    });

    onClick("charcard", (card) => {
        playSound(800, 0.1);
        selectedCharacterIndex = card.charIndex;
        saveProgress();
        go("map");
    });
});

scene("map", () => {
    drawSpaceBackground();
    drawBannerAd();

    add([rect(width(), 50), pos(0, 0), color(15, 25, 45), fixed(), z(10)]);
    add([text("SELECT LEVEL", { size: 20 }), pos(width() / 2, 25), anchor("center"), color(255, 255, 255), fixed(), z(11)]);

    const donateBtn = add([rect(110, 32, { radius: 6 }), pos(width() - 175, 10), color(220, 50, 130), outline(2, rgb(255, 255, 255)), area(), fixed(), z(15)]);
    donateBtn.add([text("❤️ Donate", { size: 13 }), anchor("center"), pos(55, 16), color(255, 255, 255)]);
    donateBtn.onClick(() => {
        playSound(700, 0.1);
        window.open("https://itch.io", "_blank");
    });

    const activeChar = characters[selectedCharacterIndex] || characters[0];
    const charBtn = add([rect(50, 32, { radius: 6 }), pos(width() - 60, 10), color(80, 40, 120), outline(2, rgb(255, 215, 0)), area(), fixed(), z(15)]);
    const btnSym = charBtn.add([text(activeChar.symbol, { size: 20 }), anchor("center"), pos(25, 16)]);
    if (["bee", "bird", "eagle"].includes(activeChar.type)) btnSym.scale = vec2(-1, 1);
    charBtn.onClick(() => { playSound(700, 0.1); go("character-select"); });

    let scrollY = 0;
    const mapContainer = add([pos(0, 0)]);
    const totalLevels = 66, cols = 5, startX = 85, startY = 95, spacingX = 115, spacingY = 90;

    for (let i = 1; i <= totalLevels; i++) {
        const row = Math.floor((i - 1) / cols);
        const col = (i - 1) % cols;
        const posX = startX + col * spacingX;
        const posY = startY + row * spacingY;
        const isUnlocked = i <= maxUnlockedLevel;

        const lvlBtn = mapContainer.add([
            circle(26), pos(posX, posY),
            color(isUnlocked ? rgb(138, 43, 226) : rgb(180, 50, 50)),
            outline(3, rgb(255, 255, 255)), area(), "levelbtn",
            { levelNum: i, unlocked: isUnlocked }
        ]);
        lvlBtn.add([text(`${i}`, { size: 16 }), anchor("center"), color(255, 255, 255)]);
    }

    onScroll((delta) => {
        scrollY -= delta.y * 0.8;
        scrollY = clamp(scrollY, 0, Math.max(0, Math.ceil(totalLevels / cols) * spacingY - 350));
        mapContainer.pos.y = -scrollY;
    });

    onClick("levelbtn", (btn) => {
        if (btn.unlocked) {
            playSound(650, 0.1);
            currentLevelNum = btn.levelNum;
            saveProgress();
            go("game");
        } else {
            playSound(120, 0.2);
        }
    });
});

scene("game", () => {
    let score = 0;
    const targetScore = 12 + ((currentLevelNum - 1) * 2);
    let isPaused = false, portalSpawned = false, swordsSpawnedCount = 0, gameEnded = false;

    // Speed Progression System
    let SPEED = 150;
    if (currentLevelNum <= 10) {
        SPEED = 150 + (currentLevelNum * 3);
    } else if (currentLevelNum <= 20) {
        SPEED = 190 + (currentLevelNum * 2);
    } else if (currentLevelNum <= 50) {
        SPEED = 230 + ((currentLevelNum - 20) * 1.2);
    } else if (currentLevelNum <= 60) {
        SPEED = 270 + ((currentLevelNum - 50) * 2);
    } else {
        SPEED = 290 + ((currentLevelNum - 60) * 3);
    }
    SPEED = Math.min(SPEED, 330);

    let GAP = Math.max(110, 150 - (currentLevelNum * 0.5));

    setGravity(1400);
    drawSpaceBackground();

    const topWallHeight = 35;
    const topWall = add([rect(width(), topWallHeight), pos(0, 0), color(30, 40, 60), area(), "obstacle"]);
    for (let i = 0; i < Math.ceil(width() / 20); i++) {
        topWall.add([polygon([vec2(0, 0), vec2(10, 25), vec2(20, 0)]), pos(i * 20, topWallHeight), color(200, 220, 240), outline(2, rgb(100, 120, 150))]);
    }

    const activeCharData = characters[selectedCharacterIndex] || characters[0];
    const player = add([
        pos(100, 200), color(activeCharData.color),
        area({ shape: new Rect(vec2(-8, -8), 16, 16) }), body(), anchor("center"), "player"
    ]);

    const playerSym = player.add([text(activeCharData.symbol, { size: 32 }), anchor("center")]);
    if (["bee", "bird", "eagle"].includes(activeCharData.type)) playerSym.scale = vec2(-1, 1);

    function playerJump() {
        if (player.exists() && !isPaused && !gameEnded) {
            player.jump(430);
            playSound(750, 0.12);
        }
    }
    onKeyPress("space", playerJump);
    onMousePress(playerJump);

    const uiLabel = add([text(`Score: ${score}/${targetScore}`, { size: 16 }), pos(20, 15), fixed(), color(255, 255, 255), z(5)]);
    
    const pauseBtn = add([rect(42, 32, { radius: 6 }), pos(width() - 55, 12), color(50, 120, 220), outline(2, rgb(255, 255, 255)), area(), fixed(), z(10)]);
    pauseBtn.add([text("⏸", { size: 16 }), anchor("center"), pos(21, 16), color(255, 255, 255)]);

    let pauseOverlay = null;
    pauseBtn.onClick(() => {
        if (isPaused || gameEnded) return;
        isPaused = true;
        playSound(850, 0.15);
        player.paused = true;

        pauseOverlay = add([pos(0, 0), fixed(), z(30)]);
        pauseOverlay.add([rect(width(), height()), color(0, 0, 0), opacity(0.6)]);
        pauseOverlay.add([rect(280, 180, { radius: 12 }), pos(width() / 2, height() / 2), anchor("center"), color(40, 25, 60), outline(2, rgb(200, 100, 255))]);
        pauseOverlay.add([text("GAME PAUSED", { size: 20 }), pos(width() / 2, height() / 2 - 45), anchor("center"), color(255, 215, 0)]);

        const resumeBtn = pauseOverlay.add([rect(180, 36, { radius: 8 }), pos(width() / 2, height() / 2 + 10), anchor("center"), color(50, 205, 50), area()]);
        resumeBtn.add([text("RESUME", { size: 14 }), anchor("center"), color(255, 255, 255)]);
        resumeBtn.onClick(() => {
            playSound(700, 0.1);
            isPaused = false;
            player.paused = false;
            if (pauseOverlay) destroy(pauseOverlay);
        });
    });

    function createSword(xPos, yPos, heightVal, isTopSword) {
        if (heightVal <= 30) return null;
        const swordParent = add([pos(xPos, yPos), area({ shape: new Rect(vec2(3, 0), 24, heightVal) }), "obstacle"]);
        swordParent.onUpdate(() => { if (!isPaused && !gameEnded) swordParent.move(-SPEED, 0); });

        if (isTopSword) {
            swordParent.add([rect(24, heightVal - 30), pos(3, 0), color(210, 225, 240), outline(2, rgb(80, 100, 130))]);
            swordParent.add([polygon([vec2(3, heightVal - 30), vec2(15, heightVal), vec2(27, heightVal - 30)]), color(230, 240, 255)]);
        } else {
            swordParent.add([polygon([vec2(3, 30), vec2(15, 0), vec2(27, 30)]), color(230, 240, 255)]);
            swordParent.add([rect(24, heightVal - 30), pos(3, 30), color(210, 225, 240)]);
        }
        return swordParent;
    }

    function spawnSwords() {
        if (gameEnded || portalSpawned || swordsSpawnedCount >= targetScore) return;
        swordsSpawnedCount++;
        const patternType = swordsSpawnedCount % 3;
        let offset = patternType === 1 ? -75 : patternType === 2 ? 75 : rand(-20, 20);

        const topHeight = Math.max(40, (height() / 2 - GAP / 2) + offset);
        const bottomY = topHeight + GAP;
        const bottomHeight = height() - bottomY;

        createSword(width(), 0, topHeight, true);
        const bSword = createSword(width(), bottomY, bottomHeight, false);
        if (bSword) bSword.passed = false;

        if (swordsSpawnedCount < targetScore) wait(1.3, spawnSwords);
    }
    spawnSwords();

    onUpdate("obstacle", (obj) => {
        if (!isPaused && !gameEnded && obj.passed === false && obj.pos.x < player.pos.x) {
            obj.passed = true;
            score += 1;
            playSound(980, 0.15);
            uiLabel.text = `Score: ${score}/${targetScore}`;
            if (score >= targetScore && !portalSpawned) {
                portalSpawned = true;
                const portal = add([circle(42), pos(width() + 60, height() / 2), color(75, 0, 130), outline(5, rgb(0, 255, 255)), area(), anchor("center"), "blackhole"]);
                portal.onUpdate(() => { if (!isPaused && !gameEnded) portal.move(-SPEED, 0); });
                portal.add([circle(24), color(0, 0, 0), anchor("center")]);
                portal.add([circle(12), color(255, 255, 255), opacity(0.6), anchor("center")]);
            }
        }
    });

    player.onCollide("blackhole", () => {
        if (isPaused || gameEnded) return;
        gameEnded = true;
        isPaused = true;
        playSound(1300, 0.4);
        if (currentLevelNum + 1 > maxUnlockedLevel && currentLevelNum < 66) maxUnlockedLevel = currentLevelNum + 1;
        saveProgress();

        const proceedToWin = () => {
            showPopup(true, `${score}/${targetScore}`);
        };

        if (currentLevelNum > 3) {
            showWinAd(proceedToWin);
        } else {
            proceedToWin();
        }
    });

    function showWinAd(onAdComplete) {
        const adOverlay = add([pos(0, 0), fixed(), z(50)]);
        adOverlay.add([rect(width(), height()), color(0, 0, 0), opacity(0.85)]);
        adOverlay.add([text("📺 LEVEL COMPLETE AD", { size: 24 }), pos(width() / 2, height() / 2 - 40), anchor("center"), color(255, 215, 0)]);
        adOverlay.add([text("Ad playing... Please wait 3s", { size: 14 }), pos(width() / 2, height() / 2), anchor("center"), color(180, 180, 180)]);
        
        wait(3, () => {
            if (adOverlay.exists()) destroy(adOverlay);
            onAdComplete();
        });
    }

    function showPopup(isWin, finalScoreText) {
        if (player.exists()) destroy(player);
        
        let boxHeight = isWin ? 260 : 310;
        let box = add([rect(320, boxHeight, { radius: 14 }), pos(width() / 2, height() / 2 - 10), anchor("center"), color(45, 25, 60), outline(3, rgb(220, 100, 220)), z(20)]);
        add([text(isWin ? `Level ${currentLevelNum} Cleared!` : "Game Over", { size: 22 }), pos(width() / 2, height() / 2 - 110), anchor("center"), color(255, 215, 0), z(21)]);
        add([text(`Score: ${finalScoreText}`, { size: 16 }), pos(width() / 2, height() / 2 - 50), anchor("center"), color(255, 255, 255), z(21)]);

        if (!isWin) {
            const extraLifeBtn = add([rect(180, 32, { radius: 8 }), pos(width() / 2, height() / 2 - 10), anchor("center"), color(230, 140, 0), area(), z(21)]);
            extraLifeBtn.add([text("🎬 Extra Life (Ad)", { size: 12 }), anchor("center"), color(255, 255, 255)]);
            extraLifeBtn.onClick(() => {
                playSound(900, 0.15);
                go("game");
            });
        }

        const primaryBtnY = isWin ? height() / 2 + 5 : height() / 2 + 32;
        const primaryBtn = add([rect(180, 34, { radius: 8 }), pos(width() / 2, primaryBtnY), anchor("center"), color(isWin ? rgb(50, 205, 50) : rgb(220, 80, 80)), area(), z(21)]);
        primaryBtn.add([text(isWin ? "NEXT LEVEL" : "REPLAY", { size: 13 }), anchor("center"), color(255, 255, 255)]);
        primaryBtn.onClick(() => {
            if (isWin) {
                if (currentLevelNum < 66) { currentLevelNum += 1; saveProgress(); go("game"); } else { go("map"); }
            } else { go("game"); }
        });

        const secondaryBtnY = isWin ? height() / 2 + 50 : height() / 2 + 74;
        const secondaryBtn = add([rect(180, 30, { radius: 8 }), pos(width() / 2, secondaryBtnY), anchor("center"), color(70, 130, 180), area(), z(21)]);
        secondaryBtn.add([text("BACK TO MAP", { size: 11 }), anchor("center"), color(255, 255, 255)]);
        secondaryBtn.onClick(() => { saveProgress(); go("map"); });
    }

    function showInterstitialAd() {
        const adOverlay = add([pos(0, 0), fixed(), z(50)]);
        adOverlay.add([rect(width(), height()), color(0, 0, 0), opacity(0.85)]);
        adOverlay.add([text("📺 INTERSTITIAL AD", { size: 24 }), pos(width() / 2, height() / 2 - 40), anchor("center"), color(255, 215, 0)]);
        adOverlay.add([text("Ad playing... Please wait 3s", { size: 14 }), pos(width() / 2, height() / 2), anchor("center"), color(180, 180, 180)]);
        
        wait(3, () => {
            if (adOverlay.exists()) destroy(adOverlay);
            showPopup(false, `${score}/${targetScore}`);
        });
    }

    function triggerGameOver() {
        if (gameEnded) return;
        gameEnded = true;
        isPaused = true;
        playCrashSound();
        if (player.exists()) { player.unuse("body"); player.unuse("area"); }
        
        lossCounter++;
        consecutiveLosses++;
        
        let shouldShowAd = (consecutiveLosses >= adThreshold);

        if (shouldShowAd) {
            consecutiveLosses = 0; 
            adThreshold = Math.random() < 0.5 ? 2 : 3; 
        }

        saveProgress();

        wait(0.6, () => {
            if (shouldShowAd) {
                showInterstitialAd();
            } else {
                showPopup(false, `${score}/${targetScore}`);
            }
        });
    }

    player.onCollide("obstacle", triggerGameOver);
    player.onUpdate(() => { if (!gameEnded && (player.pos.y > height() || player.pos.y < 0)) triggerGameOver(); });
});

go("loading");
</script>
